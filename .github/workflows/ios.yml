name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v3

      # Flutter cache
      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            .packages
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-

      # CocoaPods cache
      - name: Cache CocoaPods
        uses: actions/cache@v3
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      # Select Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: 'stable'

      # Select Xcode 15.3 explicitly
      - name: Select Xcode 15.3
        run: sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer

      - run: flutter pub get

      # Ensure Podfile platform
      - name: Set iOS deployment target
        run: |
          cd ios
          if ! grep -q "platform :ios, '13.0'" Podfile; then
            echo "platform :ios, '13.0'" | cat - Podfile > temp && mv temp Podfile
          fi
          cd ..

      # Install CocoaPods (skip pod repo update every time)
      - name: Install CocoaPods
        run: |
          cd ios
          pod install --verbose
          cd ..

      # Build iOS release
      - run: flutter build ios --release --no-codesign

      # Package IPA
      - run: mkdir Payload
        working-directory: build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      # Upload IPA as artifact instead of Release
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlutterIpaExport
          path: build/ios/iphoneos/FlutterIpaExport.ipa
